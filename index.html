<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Directorio de cafés en Caracas. Descubre lugares para tomar café, trabajar o reunirte." />
  <title>Cafés de Caracas</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- Hero -->
  <header class="site-header">
  <div class="site-header__top">
    <a class="brand" href="./index.html" aria-label="Caracas Café">
      <span class="brand__name">Caracas Café</span>
    </a>

    <nav class="main-categories" aria-label="Categorías principales">
      <button class="main-category main-category--active" type="button" data-category="all">
        Todos
      </button>

      <button class="main-category" type="button" data-category="coworking">
        Coworking
      </button>

      <button class="main-category" type="button" data-category="cozy">
        Cozy
      </button>

      <button class="main-category" type="button" data-category="sightseeing">
        Sightseeing
      </button>
    </nav>

    <div class="header-actions">
      <a class="header-actions__link" href="#add-cafe">
        Agregar un café
      </a>

      <button
        class="header-actions__menu"
        type="button"
        aria-label="Abrir menú"
      >
        ☰
      </button>
    </div>
  </div>

  <div class="search-shell">
    <button
      class="search-trigger"
      id="searchTrigger"
      type="button"
      aria-expanded="false"
      aria-controls="advancedSearch"
    >
      <span class="search-trigger__text">
        Buscar cafés en Caracas
      </span>

      <span class="search-trigger__icon" aria-hidden="true">
        🔍
      </span>
    </button>

    <div class="advanced-search" id="advancedSearch" hidden>
      <div class="advanced-search__grid">
        <label class="advanced-search__field">
          <span>Zona</span>
          <select id="zoneFilter">
            <option value="">Todas las zonas</option>
            <option value="este">Este</option>
            <option value="centro-este">Centro-este</option>
            <option value="centro">Centro</option>
            <option value="oeste">Oeste</option>
          </select>
        </label>

        <label class="advanced-search__field">
          <span>Tipo de lugar</span>
          <select id="typeFilter">
            <option value="">Todos los tipos</option>
            <option value="cafetería">Cafetería</option>
            <option value="especialidad">Especialidad</option>
            <option value="brunch">Brunch</option>
            <option value="pastelería">Pastelería</option>
            <option value="panadería">Panadería</option>
          </select>
        </label>

        <label class="advanced-search__field">
          <span>Presupuesto</span>
          <select id="priceFilter">
            <option value="">Cualquier precio</option>
            <option value="5">$5 o menos</option>
            <option value="10">$5–10</option>
            <option value="20">$10–20</option>
            <option value="21">$20+</option>
          </select>
        </label>

        <label class="advanced-search__field advanced-search__field--wide">
          <span>Buscar por nombre o especialidad</span>
          <input
            type="search"
            id="searchInput"
            placeholder="Ej. Casa Canela, brunch, terraza..."
            autocomplete="off"
          />
        </label>
      </div>
    </div>
  </div>
</header>

  <!-- Main -->
  <main>
    <section class="directory" aria-labelledby="directory-title">
      <div class="section-heading">
        <div>
          <span class="eyebrow">EXPLORA</span>
          <h2 id="directory-title">Coffee shops</h2>
        </div>

        <p id="resultCount" class="result-count" aria-live="polite"></p>
      </div>

      <!-- Coffee Shop Grid -->
      <div id="coffeeShopList" class="coffee-grid"></div>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state" hidden>
        <h3>No encontramos cafés.</h3>
        <p>Prueba con otra zona, nombre o tipo de café.</p>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>Directorio de cafés en Caracas</p>
  </footer>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
