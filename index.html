<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Directorio de cafés en Caracas. Descubre lugares para tomar café, trabajar o reunirte." />
  <title>Cafés de Caracas</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />

  <!-- CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- Hero -->
  <header class="app-header">

  <div class="app-header__top">

    <a class="brand" href="./index.html">
      <span class="brand__logo">☕</span>

      <div>
        <strong>Caracas Café</strong>
        <small>Descubre Caracas café por café</small>
      </div>
    </a>

    <button id="searchLauncher" class="search-trigger">

      <div class="search-trigger__item">
        <strong>Buscar</strong>
        <span>Nombre o cafetería</span>
      </div>

      <div class="search-trigger__divider"></div>

      <div class="search-trigger__item">
        <strong>Zona</strong>
        <span>Todas</span>
      </div>

      <div class="search-trigger__divider"></div>

      <div class="search-trigger__item">
        <strong>Tipo</strong>
        <span>Coworking, Cozy...</span>
      </div>

      <span class="search-trigger__icon">
        🔍
      </span>

    </button>

  </div>

  <nav class="primary-filters">

    <button class="primary-filter active" data-category="all">
      Todo
    </button>

    <button class="primary-filter" data-category="coworking">
      Coworking
    </button>

    <button class="primary-filter" data-category="cozy">
      Cozy
    </button>

    <button class="primary-filter" data-category="sightseeing">
      Sightseeing
    </button>

  </nav>

</header>
  <!-- Main -->
  <main>
    <section class="directory" aria-labelledby="directory-title">
      <div class="section-heading">
        <div>
          <span class="eyebrow">EXPLORA</span>
          <h2 id="directory-title">Coffee shops</h2>
        </div>

        <p id="resultCount" class="result-count" aria-live="polite"></p>
      </div>

      <!-- Coffee Shop Grid -->
      <div id="coffeeShopList" class="coffee-grid"></div>

      <!-- Empty State -->
      <div id="emptyState" class="empty-state" hidden>
        <h3>No encontramos cafés.</h3>
        <p>Prueba con otra zona, nombre o tipo de café.</p>
      </div>
    </section>
  </main>

  <!-- Footer -->
  <footer>
    <p>Directorio de cafés en Caracas</p>
  </footer>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
